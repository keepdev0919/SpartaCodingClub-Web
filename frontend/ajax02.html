<!doctype html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<title>JQuery 연습하고 가기!</title>
<!-- JQuery를 import 합니다 -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<style type="text/css">
div.question-box {
margin: 10px 0 20px 0;
}

table {
border: 1px solid;
border-collapse: collapse;
}

td,
th {
padding: 10px;
border: 1px solid;
}

.bad {
    color: red;
}
</style>

<script>
function q1() {
// 여기에 코드를 입력하세요
    $('#names-q1').empty();
    $.ajax({
            type: "GET",
            url: "http://openapi.seoul.go.kr:8088/6d4d776b466c656533356a4b4b5872/json/RealtimeCityAir/1/99",
            data: {},
            success: function(response){
            
            let rows = response['RealtimeCityAir']['row'];
            
            for (let i=0; i<rows.length; i++){
                let gu_name = rows[i]['MSRSTN_NM']
                let gu_pm = rows[i]['PM']
                let gu_fpm = rows[i]['FPM']
                


                let temp_html = ``

                if (gu_pm < 30){
                    temp_html =`
                    <tr class="bad">
                    <td>${gu_name}</td>
                    <td>${gu_pm}</td>
                    <td>${gu_fpm}</td>
                    </tr>`
                }
                else {
                    temp_html = `
                    <tr>
                    <td>${gu_name}</td>
                    <td>${gu_pm}</td>
                    <td>${gu_fpm}</td>
                    </tr>`
                }
                
                $('#names-q1').append(temp_html)
                                
            }
            }
        });
}
</script>

</head>

<body>
<h1>jQuery + Ajax의 조합을 연습하자!</h1>

<hr />

<div class="question-box">
<h2>2. 서울시 OpenAPI(실시간 따릉기 현황)를 이용하기</h2>
<p>모든 위치의 따릉이 현황을 보여주세요</p>
<p>업데이트 버튼을 누를 때마다 지웠다 새로 씌여져야 합니다.</p>
<button onclick="q1()">업데이트</button>
<table>
<thead>
<tr>
<td>구 이름</td>
<td>구 pm</td>
<td>구 fpm</td>
</tr>
</thead>
<tbody id="names-q1">
</tbody>
</table>
</div>
</body>

</html>
